name: Tag release and deploy to plone.org.br

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  config:
    uses: ./.github/workflows/config.yml
    with:
      environment: "plone.org.br"

  backend:
    uses: ./.github/workflows/backend.yml
    needs:
        - config
    with:
        base-tag: ${{ needs.config.outputs.base-tag }}
        image-name-prefix: ${{ needs.config.outputs.image-name-prefix }}
        image-name-suffix: backend
        python-version: ${{ needs.config.outputs.python-version }}
        plone-version: ${{ needs.config.outputs.plone-version }}
    permissions:
      contents: read
      packages: write

  frontend:
    uses: ./.github/workflows/frontend.yml
    needs:
        - config
    with:
        base-tag: ${{ needs.config.outputs.base-tag }}
        image-name-prefix: ${{ needs.config.outputs.image-name-prefix }}
        image-name-suffix: frontend
        node-version: ${{ needs.config.outputs.node-version }}
        volto-version: ${{ needs.config.outputs.volto-version }}
    permissions:
      contents: read
      packages: write

  deploy:
    name: "Deploy to Production"
    needs:
      - config
      - backend
      - frontend
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ needs.config.outputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.config.outputs.environment }}
      url: https://${{ needs.config.outputs.environment }}
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy
        uses: kitconcept/docker-stack-deploy@v1.6.0
        # The images on ghcr.io/plonegovbr are public, so the swarm pulls them
        # without a registry login.
        with:
            remote_host: ${{ secrets.DEPLOY_HOST }}
            remote_port: ${{ secrets.DEPLOY_PORT }}
            remote_user: ${{ secrets.DEPLOY_USER }}
            remote_private_key: ${{ secrets.DEPLOY_SSH }}
            stack_file: 'devops/stacks/stack.yml'
            stack_name: ${{ needs.config.outputs.stack-name }}
            stack_param: ${{ needs.config.outputs.base-tag }}
            env_file: |
              ${{ vars.ENV_VARS }}
              ${{ secrets.ENV_SECRETS }}
              IMAGE_TAG=${{ needs.config.outputs.base-tag }}
            deploy_timeout: 480
